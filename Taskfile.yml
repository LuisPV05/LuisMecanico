version: '3'

tasks:
  install:
    desc: Descarga las dependencias del módulo
    cmds:
      - go mod download

  test:
    desc: Ejecuta los tests del proyecto
    cmds:
      - go test ./...

  check:
    desc: Comprueba la sintaxis de los fuentes y nada más
    cmds:
      - gofmt -e . > /dev/null